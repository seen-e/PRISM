run_id: prism_qwenpi_v3
run_root_dir: ./results/PRISM
seed: 42
wandb_entity: null
wandb_project: prism_starvla
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /path/to/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
    num_vl_layers: 36
    enable_gradient_checkpointing: false
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 8
    state_dim: 8
    action_horizon: 15
    repeated_diffusion_steps: 8
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    use_psw: true
    psw_gamma: 2.0
    psw_tau_0: 1.0
    psw_p: 2.0
    psw_eps: 1.0e-6
    psw_use_snr: true
    use_cpr: true
    cpr_lambda: 0.1
    cpr_hidden_dim: 256
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
      output_dim: 1024
      cross_attention_dim: 1024
      num_layers: 36
      input_embedding_dim: 1024
      num_attention_heads: 16

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /path/to/data
    data_mix: replace_with_registered_mix
    pps_root: /path/to/pps_output
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 12
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    lerobot_version: v3.0

trainer:
  pretrained_checkpoint: /path/to/steps_50000_pytorch_model.pt
  pretrained_allow_shape_mismatch: true
  max_train_steps: 15000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 8000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  repeated_diffusion_steps: 8
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
